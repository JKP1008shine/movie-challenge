name: "📋 Share a weekly watchlist"
description: Your films for one week. Each week's list locks at 12:00 am on the Tuesday it starts (Monday midnight). Submit again to change it before then; your latest list for that week counts.
title: "[Watchlist] "
labels: ["watchlist"]
body:
  - type: dropdown
    id: week
    attributes:
      label: Week
      options:
        - "Week 1 (1-7 Dec) · The Comeback"
        - "Week 2 (8-14 Dec) · World Tour"
        - "Week 3 (15-21 Dec) · Director Deep Dive"
        - "Week 4 (22-28 Dec) · Decades Run"
    validations:
      required: true
  - type: textarea
    id: theme
    attributes:
      label: Theme films
      description: "At least 2 films that fit this week's theme, one per line. Add the year in brackets, like: Jaws (1975). Your opponent's picks can count too. Week 3: films by the director your opponent chose for you."
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Other films
      description: Your free picks for the week, one per line.

name: "✋ Veto an assigned film"
description: Reject one film your opponent assigned you. You get ONE veto for the whole month. It must be filed before that week's picks lock (Monday midnight).
title: "[Veto] "
labels: ["veto"]
body:
  - type: input
    id: film
    attributes:
      label: Film you're vetoing
      description: Type the title exactly as it appears in their picks.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason (optional)

name: "🚩 Raise a violation"
description: Report your opponent for an unpaid fine or a copied post.
title: "[Violation] "
labels: ["violation"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What's the violation?
      options:
        - "Unpaid or late fine (doubles it if unpaid by Wednesday midnight)"
        - "Copied Instagram post or review (film scores 0, -3)"
        - "Other rule break (settle it in the chat)"
    validations:
      required: true
  - type: dropdown
    id: week
    attributes:
      label: Week (for unpaid fines)
      options:
        - "Week 1 (1-7 Dec)"
        - "Week 2 (8-14 Dec)"
        - "Week 3 (15-21 Dec)"
        - "Week 4 (22-28 Dec)"
  - type: input
    id: film
    attributes:
      label: Film ID (for copied posts)
      description: The film's ID from the Film log, like LB-574954935 or #12.
      placeholder: "LB-574954935"
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Explain what happened. For a copied post, paste the link to the original.
    validations:
      required: true

name: "🔍 Report a spot-check"
description: "Fair-play rules: ask about what happens (not background details), two questions, they pass with one right, only within 48 hours of the film being logged, and you must know the answer yourself."
title: "[Spot-check] "
labels: ["spot-check"]
body:
  - type: input
    id: film
    attributes:
      label: Film issue number
      description: The number of your opponent's film issue, like 12
      placeholder: "12"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - "Failed: got both questions wrong (film scores 0 and -2 points)"
        - "Passed: got at least one right"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: The two questions you asked
